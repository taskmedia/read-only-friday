version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    ignore:
      # typescript-eslint caps support at `typescript <6.1.0`; a major bump
      # here breaks peer dependency resolution until that's lifted.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
